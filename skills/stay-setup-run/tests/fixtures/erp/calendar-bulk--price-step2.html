


<div id="stay_calendar_bulk_00000000" class="stay-root stay-readable" data-stay-screen="calendar-bulk">
  <input type="hidden" name="option" value="{room:1}" id="id_stay_option"><input type="hidden" name="rate_plan" value="{rate_plan:1}" id="id_stay_rate_plan"><input type="hidden" name="operation" value="price" id="id_stay_operation"><input type="hidden" name="month" value="2026-07" id="id_stay_month">
  <section class="stay-card">
    <h4 class="stay-section-title">적용 대상</h4>
    <dl class="stay-facts">
      <dt>오퍼</dt><dd>〈오퍼 관리용 이름〉</dd>
      <dt>객실</dt><dd>〈오퍼 관리용 이름〉 · 디럭스</dd>
      <dt>요금제</dt><dd>조식 포함</dd>
    </dl>
    
  </section>
  
  
  
  <input type="hidden" name="scope" value="plan">
  <input type="hidden" name="date_selection_0" value="2026-07-01">
  <input type="hidden" name="date_selection_1" value="">
  
  <input type="hidden" name="period_from" value="2026-07-01">
  <input type="hidden" name="period_to" value="2026-07-31">
  <input type="hidden" name="weekdays" value="0"><input type="hidden" name="weekdays" value="1"><input type="hidden" name="weekdays" value="2"><input type="hidden" name="weekdays" value="3"><input type="hidden" name="weekdays" value="4"><input type="hidden" name="weekdays" value="5"><input type="hidden" name="weekdays" value="6">
  <section class="stay-card">
    <h4 class="stay-section-title">적용 내용 · 1일</h4>
    <div class="table1 stay-table-scroll">
      <table class="bs-table stay-table stay-aligned-table">
        <thead><tr><th>숙박일</th><th>현재 가격·마감 상태</th></tr></thead>
        <tbody><tr><td>2026-07-01</td><td>가격 판매 가능</td></tr></tbody>
      </table>
    </div>
    
    
  </section>
  
  
  <section class="stay-card">
    <h4 class="stay-section-title" data-stay-label-for="prices">선택 날짜의 가격</h4>
    <p class="stay-description">입력한 칸만 바뀝니다. 비운 칸과 마감 상태는 그대로입니다.</p>
    <input type="hidden" name="prices-TOTAL_FORMS" value="1" id="id_stay_prices-TOTAL_FORMS"><input type="hidden" name="prices-INITIAL_FORMS" value="1" id="id_stay_prices-INITIAL_FORMS"><input type="hidden" name="prices-MIN_NUM_FORMS" value="0" id="id_stay_prices-MIN_NUM_FORMS"><input type="hidden" name="prices-MAX_NUM_FORMS" value="550" id="id_stay_prices-MAX_NUM_FORMS">
    
    <div class="table1 stay-table-scroll">
      <table class="bs-table stay-table stay-aligned-table stay-calendar-bulk-prices" data-stay-field="prices" data-stay-kind="rows" data-stay-rows="prices">
        <thead><tr><th>기존</th><th class="stay-numeric">판매가 (공급 통화)</th><th class="stay-numeric">정가 (공급 통화)</th><th class="stay-numeric">공급 원가 (공급 통화)</th></tr></thead>
        
        <tbody class="stay-calendar-bulk-line" data-stay-occupancy-key="" data-stay-los-nights="1">
          <tr class="stay-calendar-bulk-line__head"><th colspan="4" scope="rowgroup"><input type="hidden" name="prices-0-occupancy_key" id="id_stay_prices-0-occupancy_key"><input type="hidden" name="prices-0-los_nights" value="1" id="id_stay_prices-0-los_nights">인원 무관 단일가 · 1박 이상</th></tr>
          <tr data-stay-existing><td>2026-07-01</td><td class="stay-numeric">120000.00</td><td class="stay-numeric">없음</td><td class="stay-numeric">없음</td></tr>
          
          <tr class="stay-calendar-bulk-line__new"><td>새 값</td><td class="stay-numeric"><input type="number" name="prices-0-price" data-stay-col="price" min="0" step="0.01" id="id_stay_prices-0-price"></td><td class="stay-numeric"><input type="number" name="prices-0-original_price" data-stay-col="original_price" min="0" step="0.01" id="id_stay_prices-0-original_price"></td><td class="stay-numeric"><input type="number" name="prices-0-net_amount" data-stay-col="net_amount" min="0" step="0.01" id="id_stay_prices-0-net_amount"></td></tr>
        </tbody>
        
      </table>
    </div>
    
    
    <div class="stay-calendar-bulk-add">
      <span class="stay-calendar-form__sr" data-stay-label-for="add_occupancy">추가할 인원 조합</span>
      <select name="add_occupancy" class="browser-default" data-stay-field="add_occupancy" data-stay-kind="select" aria-label="추가할 인원 조합">
        <option value="A1">A1 · 성인 1</option><option value="A1C1_CHILD">A1C1_CHILD · 성인 1 · 소아 1</option><option value="A1C1_INFANT">A1C1_INFANT · 성인 1 · 유아 1</option><option value="A2">A2 · 성인 2</option><option value="A2C1_CHILD">A2C1_CHILD · 성인 2 · 소아 1</option><option value="A2C1_INFANT">A2C1_INFANT · 성인 2 · 유아 1</option>
      </select>
      <button type="button" class="stay-btn stay-btn--ghost" data-stay-action="add_row"
              hx-get="/stay/{master:1}/calendar/bulk/" hx-include="#stay_calendar_bulk_00000000 :is(input,select,textarea)"
              hx-target="#stay_drawer_body" hx-swap="innerHTML">인원 조합 추가</button>
    </div>
    
  </section>
  
  <div class="stay-drawer__footer">
    <button type="button" class="stay-btn stay-btn--ghost" data-stay-action="back"
            hx-get="/stay/{master:1}/calendar/bulk/?operation=price&amp;option={room:1}&amp;rate_plan={rate_plan:1}&amp;month=2026-07&amp;scope=plan&amp;period_from=2026-07-01&amp;period_to=2026-07-31&amp;weekdays=0&amp;weekdays=1&amp;weekdays=2&amp;weekdays=3&amp;weekdays=4&amp;weekdays=5&amp;weekdays=6"
            hx-target="#stay_drawer_body" hx-swap="innerHTML">기간 다시 선택</button>
    <button type="button" class="stay-btn stay-btn--primary" data-stay-action="save"
            hx-post="/stay/{master:1}/calendar/bulk/" hx-include="#stay_calendar_bulk_00000000 :is(input,select,textarea)"
            hx-target="#stay_drawer_body" hx-swap="innerHTML" hx-disable="this">입력한 가격 적용</button>
  </div>
  
</div>
