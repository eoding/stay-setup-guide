


<div id="stay_offer_charges" class="stay-root stay-readable" data-stay-panel="charges">
  
  <span hidden
        hx-get="/stay/{master:1}/charges/"
        hx-trigger="stay:rooms-changed from:body, stay:offers-changed from:body"
        hx-target="#stay_offer_charges"
        hx-swap="outerHTML"></span>


  

  <div class="stay-panel-intro"><h4 class="stay-section-title">부과금</h4></div>

  
  <div class="stay-card" data-stay-entity="offer" data-stay-name="〈오퍼 관리용 이름〉" data-stay-entity-id="{offer:1}">
    <div class="stay-card__head">
      
      <h4 class="stay-card__title">〈오퍼 관리용 이름〉 <small style="margin-left:4px;font-weight:400;color:var(--stay-text-tertiary)">#{offer:1}</small>
</h4>
      <button type="button" class="stay-btn stay-btn--primary" data-stay-action="open_create"
              hx-get="/stay/{master:1}/offers/{offer:1}/charges/new/"
              hx-target="#stay_drawer_body" hx-swap="innerHTML">
        부과금 추가
      </button>
    </div>

    
    <div class="table1 stay-table-scroll">
      <table class="bs-table stay-table stay-aligned-table">
        <colgroup>
          <col style="width:22%"><col style="width:13%"><col style="width:12%"><col style="width:14%">
          <col style="width:13%"><col style="width:15%"><col style="width:11%">
        </colgroup>
        <thead>
          <tr>
            <th>이름</th>
            <th>종류</th>
            <th>부과 방식</th>
            <th>금액</th>
            <th>적용 범위</th>
            <th>적용 날짜</th>
            <th class="stay-column-center">액션</th>
          </tr>
        </thead>
        <tbody>
          
          <tr data-stay-entity="charge" data-stay-name="리조트피" data-stay-entity-id="{charge:1}">
            <td>
              리조트피
              
              <br><small>컨펌 불가 시: 기본 시간으로 진행(해당 라인만 환불)</small>
              
              
            </td>
            <td>
              
              <span class="stay-cond stay-cond--included">
                <span class="stay-cond__icon" aria-hidden="true">&#10003;</span>
                기타
              </span>
            </td>
            <td>정액</td>
            <td>
              
              <span class="stay-money">25.00 공급 통화</span>
              
              <br><small>체류당 1회</small>
              
              
              
            </td>
            <td>
              
              <small>이 오퍼의 모든 객실</small>
              
              
<div data-stay-saved-scope>

  <div><strong>객실</strong>: 기존 범위 그대로
    
    
    
  </div>

</div>

            </td>
            <td>
              
              
              <small>선택 항목 (고객이 고를 때만)</small>
              
            </td>
            <td class="td_actions">
              <div class="stay-actions">
              <button type="button" class="stay-btn stay-btn--ghost" data-stay-action="open_questions"
                      hx-get="/stay/{master:1}/charges/{charge:1}/questions/new/"
                      hx-target="#stay_drawer_body" hx-swap="innerHTML">
                정보 수집 폼
              </button>
              <button type="button" class="stay-btn stay-btn--ghost" data-stay-action="open_edit"
                      hx-get="/stay/{master:1}/charges/{charge:1}/edit/"
                      hx-target="#stay_drawer_body" hx-swap="innerHTML">
                편집
              </button>
              <button type="button" class="stay-btn stay-btn--danger" data-stay-action="delete"
                      title="이 부과금과 시간 티어를 함께 지웁니다 — 되돌릴 수 없고, 차단 조건은 없습니다(누르면 바로 지워집니다)"
                      hx-post="/stay/{master:1}/charges/{charge:1}/delete/"
                      hx-target="#stay_offer_charges" hx-swap="outerHTML"
                      hx-confirm="이 부과금을 삭제할까요? 시간 티어도 함께 지워집니다.">
                삭제
              </button>
              </div>
            </td>
          </tr>
          
        </tbody>
      </table>
    </div>
    
  </div>
  

  
</div>
