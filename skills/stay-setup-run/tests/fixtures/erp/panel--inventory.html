  <span hidden
        hx-get="/stay/{master:1}/inventory/?month=2026-07"

  <style>
    #stay_inventory .stay-inv-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    #stay_inventory .stay-inv-month { min-width: 92px; text-align: center; font-size: 14px; }
    #stay_inventory .stay-inv-scroll { margin-top: 12px; overflow-x: auto; }
    #stay_inventory .stay-inv-table { width: 100%; min-width: 1100px; table-layout: fixed; border-collapse: collapse; }
    #stay_inventory .stay-inv-col-offer { width: 96px; }
    #stay_inventory .stay-inv-col-link { width: 132px; }
    #stay_inventory .stay-inv-col-sub { width: 46px; }
    #stay_inventory .stay-inv-table th,
    #stay_inventory .stay-inv-table td {
      height: 22px;
      padding: 1px 2px;
      font-size: 11px;
      line-height: 1.3;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      overflow: hidden;
    }
    #stay_inventory .stay-inv-table thead th { height: 34px; }
    #stay_inventory .stay-inv-table thead th small { display: block; font-size: 10px; font-weight: 400; color: var(--stay-text-tertiary); }
    #stay_inventory .stay-inv-table thead th.is-sat { color: var(--stay-blue-6); }
    #stay_inventory .stay-inv-table thead th.is-sun { color: var(--stay-blocking); }
    #stay_inventory .stay-inv-table thead th[data-today] { outline: 2px solid var(--stay-blue-6); outline-offset: -2px; }
    #stay_inventory .stay-inv-table td.stay-inv-offer,
    #stay_inventory .stay-inv-table td.stay-inv-link {
      padding: 6px;
      text-align: left;
      vertical-align: top;
      white-space: normal;
      color: var(--stay-text);
      background: var(--stay-bg-surface);
    }
    #stay_inventory .stay-inv-table td.stay-inv-offer { font-weight: 600; }
    #stay_inventory .stay-inv-table td.stay-inv-offer small { display: block; font-weight: 400; color: var(--stay-text-tertiary); }
    #stay_inventory .stay-inv-table th.stay-inv-sub { font-weight: 500; color: var(--stay-text-secondary); background: var(--stay-bg-thead); }
    #stay_inventory .stay-inv-table tr.stay-inv-tr--first > * { border-top: 2px solid var(--stay-border-emphasis); }
    
    #stay_inventory .stay-inv-table td.stay-inv-day--none { background: var(--stay-n1); color: var(--stay-text-tertiary); }
    #stay_inventory .stay-inv-table td.stay-inv-rem { font-weight: 700; color: var(--stay-text); }
    #stay_inventory .stay-inv-table td.stay-inv-rem.stay-inv-day--closed { background: var(--stay-blocking-tinted); color: var(--stay-blocking); }
    #stay_inventory .stay-inv-table td.stay-inv-rem.stay-inv-day--low { background: var(--stay-warning-tinted); color: var(--stay-warning); }
    #stay_inventory .stay-inv-table td.stay-inv-rem.stay-inv-day--oversold {
      background: var(--stay-warning-tinted);
      color: var(--stay-warning);
      box-shadow: inset 0 0 0 2px var(--stay-warning);
    }
    #stay_inventory .stay-inv-total {
      display: block;
      width: 100%;
      min-height: 20px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: var(--stay-radius-xs);
      background: none;
      font: inherit;
      font-weight: 600;
      color: var(--stay-text);
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
    }
    #stay_inventory .stay-inv-total:hover { background: var(--stay-brand-tinted); box-shadow: inset 0 0 0 1px var(--stay-brand-border); }
    #stay_inventory .stay-inv-day--none .stay-inv-total { font-size: 10px; font-weight: 400; color: var(--stay-text-tertiary); }
    #stay_inventory .stay-inv-day--oversold .stay-inv-total { color: var(--stay-warning); }
    #stay_inventory .stay-inv-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      font-size: 12px;
      color: var(--stay-text-secondary);
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
    }
    #stay_inventory .stay-inv-switch__track {
      position: relative;
      flex: 0 0 auto;
      width: 28px;
      height: 16px;
      border-radius: 999px;
      background: var(--stay-n4);
    }
    #stay_inventory .stay-inv-switch__track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--stay-bg-surface);
    }
    #stay_inventory .stay-inv-switch[aria-checked="true"] { color: var(--stay-text); font-weight: 600; }
    #stay_inventory .stay-inv-switch[aria-checked="true"] .stay-inv-switch__track { background: var(--stay-brand); }
    #stay_inventory .stay-inv-switch[aria-checked="true"] .stay-inv-switch__track::after { left: 14px; }
    #stay_inventory .stay-inv-table td.stay-inv-unlimited {
      height: auto;
      padding: 2px 8px;
      text-align: left;
      white-space: normal;
      font-size: 11px;
      color: var(--stay-text-tertiary);
    }
    #stay_inventory .stay-inv-table tr.stay-inv-sumhead th {
      padding: 6px;
      text-align: left;
      white-space: normal;
      font-weight: 400;
      color: var(--stay-text-secondary);
      background: var(--stay-bg-thead);
    }
    #stay_inventory .stay-inv-table tr.stay-inv-sum td { font-weight: 600; color: var(--stay-text); }
    #stay_inventory .stay-inv-table tr.stay-inv-sum td.stay-inv-link { font-weight: 500; }
  </style>
