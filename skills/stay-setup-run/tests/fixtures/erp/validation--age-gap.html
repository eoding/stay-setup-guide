


<div id="stay_validation_banner" class="stay-root mb-3" data-stay-screen="validation">
  <span hidden
        hx-get="/stay/{master:1}/validation/"
        hx-trigger="stay:revalidate from:body"
        hx-target="#stay_validation_banner" hx-swap="outerHTML"></span>
  
  
  <div class="stay-banner stay-banner--blocking" data-stay-card="blockers" x-data="{ open: null }">
   <div style="flex:1;min-width:0">
    <strong>🔴 이대로면 못 팝니다 (1)</strong>
    
    <ul>
      
      <li data-stay-banner="AGE_BAND_COVERAGE">
        <strong>[오퍼 · 객실]</strong> 오퍼 &#x27;〈오퍼 관리용 이름〉&#x27;의 연령 구간 — 만 4세가 어느 구간에도 없습니다. 이 나이는 성인 요금으로 계산됩니다.
        
      </li>
      
    </ul>

    
    
   </div>
  </div>
  

  
  <div class="stay-banner stay-banner--warning" data-stay-card="warnings" x-data="{ open: false, target: '' }">
   <div style="flex:1;min-width:0">
    <strong style="cursor:pointer" @click="open = !open">
      🟡 채우면 좋음 (1) <span x-text="open ? '▲' : '▼'">▼</span>
    </strong>
    <ul x-show="open" style="display:none">
      
      
      <li data-stay-banner="OFFER_NO_DISPLAY_NAME">
        오퍼 &#x27;〈오퍼 관리용 이름〉&#x27;의 표시명이 비어 있어 고객에게 관리용 이름이 노출됩니다
        
        
        <button type="button" class="stay-btn stay-btn--ghost" data-stay-action="dismiss"
                @click="target = target === '1' ? '' : '1'">
          이건 넘어가기
        </button>
        
        
        <span id="dismiss_1" x-show="target === '1'" style="display:none">
          <input type="hidden" name="rule_code" value="OFFER_NO_DISPLAY_NAME">
          <input type="text" name="reason" required
                 data-stay-field="reason" data-stay-kind="text" data-stay-required="1"
                 placeholder="사유 (예: 이 호텔은 원래 사진을 안 준다)">
          <button type="button" class="stay-btn stay-btn--primary" data-stay-action="dismiss"
                  hx-post="/stay/{master:1}/dismiss/"
                  hx-include="#dismiss_1 input"
                  hx-target="#stay_validation_banner" hx-swap="outerHTML"
                  hx-disable="this">넘어가기</button>
        </span>
        
      </li>
      
    </ul>
   </div>
  </div>
  

  
  

  
  
  

  
  <div class="stay-gate" data-stay-card="gate">
    
    <button type="button" class="stay-btn stay-btn--primary" data-stay-action="activate" disabled
            hx-post="/stay/{master:1}/activate/"
            hx-target="#stay_validation_banner" hx-swap="outerHTML">
      판매 시작
    </button>
    
    
    <span class="stay-badge stay-badge--active">판매중</span>
    <span data-stay-gate-note="still-selling">오퍼 1건이 고객 화면에 팔리는 중입니다</span>
    <span class="stay-note">위 문제는 새로 판매를 시작하는 것만 막습니다. 팔리는 중인 오퍼는 그대로 팔립니다.</span>
    
    
  </div>
</div>
